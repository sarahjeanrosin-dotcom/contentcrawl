<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Genea Content Audit</title>
<style>
  :root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page:           #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --border:         rgba(11,11,11,0.10);
    --status-good:     #0ca30c;
    --status-warning:  #fab219;
    --status-serious:  #ec835a;
    --status-critical: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --page:           #0d0d0d;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --gridline:       #2c2c2a;
      --border:         rgba(255,255,255,0.10);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --page:           #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:       #2c2c2a;
    --border:         rgba(255,255,255,0.10);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 32px 20px 80px; }

  header.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-bottom: 28px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .subtitle { color: var(--text-secondary); font-size: 14px; margin: 0; }
  .source { color: var(--text-muted); font-size: 12px; margin-top: 4px; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--text-primary); color: var(--page);
    border: none; border-radius: 8px; padding: 10px 16px;
    font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none;
    white-space: nowrap;
  }
  .btn:hover { opacity: 0.85; }

  .card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }

  .overview { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; margin-bottom: 20px; }

  .stat-tile .label { color: var(--text-secondary); font-size: 13px; margin: 0 0 6px; }
  .stat-tile .value { font-size: 32px; font-weight: 600; margin: 0; font-variant-numeric: proportional-nums; }

  .chart-card { grid-column: 1 / -1; }
  .chart-title { font-size: 13px; color: var(--text-secondary); margin: 0 0 16px; }
  .bar-row { display: grid; grid-template-columns: 110px 1fr 44px; align-items: center; gap: 10px; height: 32px; }
  .bar-row + .bar-row { margin-top: 2px; }
  .bar-label { font-size: 13px; color: var(--text-secondary); text-align: right; }
  .bar-track { position: relative; height: 24px; background: var(--gridline); border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; min-width: 4px; }
  .bar-count { font-size: 13px; color: var(--text-primary); font-variant-numeric: tabular-nums; }

  .tabs { display: flex; gap: 6px; margin-bottom: 20px; border-bottom: 1px solid var(--gridline); }
  .tab-btn {
    background: none; border: none; cursor: pointer; font-family: inherit;
    font-size: 14px; font-weight: 600; color: var(--text-secondary);
    padding: 10px 4px; margin-bottom: -1px; border-bottom: 2px solid transparent;
  }
  .tab-btn:hover { color: var(--text-primary); }
  .tab-btn.active { color: var(--text-primary); border-bottom-color: var(--text-primary); }
  .tab-btn + .tab-btn { margin-left: 14px; }

  .controls { display: flex; gap: 10px; flex-wrap: wrap; margin: 28px 0 14px; }
  .controls input, .controls select {
    background: var(--surface-1); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font-size: 13px; font-family: inherit;
  }
  .controls input { flex: 1; min-width: 200px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    text-align: left; padding: 10px 12px; color: var(--text-secondary);
    font-weight: 600; border-bottom: 1px solid var(--gridline);
    cursor: pointer; user-select: none; white-space: nowrap;
  }
  thead th:hover { color: var(--text-primary); }
  tbody tr.item-row { border-bottom: 1px solid var(--gridline); cursor: pointer; }
  tbody tr.item-row:hover { background: var(--gridline); }
  tbody td { padding: 10px 12px; vertical-align: top; }
  td.title-cell { max-width: 340px; }
  td.title-cell a { color: var(--text-primary); text-decoration: none; }
  td.title-cell a:hover { text-decoration: underline; }
  td.num { font-variant-numeric: tabular-nums; text-align: right; }
  td.type-cell { max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .flag {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
    color: var(--text-primary); border: 1px solid var(--border);
  }
  .flag .dot { width: 8px; height: 8px; border-radius: 50%; }

  tr.detail-row td { background: var(--page); padding: 16px 20px 22px; }
  tr.detail-row { display: none; }
  tr.detail-row.open { display: table-row; }
  .detail-grid { display: grid; grid-template-columns: repeat(5, auto) 1fr; gap: 20px; margin-bottom: 14px; }
  .detail-grid .mini { min-width: 60px; }
  .detail-grid .mini .label { font-size: 11px; color: var(--text-muted); margin: 0 0 2px; }
  .detail-grid .mini .value { font-size: 18px; font-weight: 600; }
  .notes { color: var(--text-secondary); font-size: 13px; margin: 0 0 12px; }
  .suggestions { margin: 0; padding-left: 18px; font-size: 13px; color: var(--text-primary); }
  .suggestions li { margin-bottom: 6px; }
  .suggestions:empty::before { content: "No suggestions — already scoring 80+."; color: var(--text-muted); list-style: none; }

  .empty { padding: 40px; text-align: center; color: var(--text-muted); }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <h1>Genea Content Audit</h1>
      <p class="subtitle" id="subtitle"></p>
      <p class="source" id="source"></p>
    </div>
    <a class="btn" id="download-btn" href="scored_latest.csv" download>Download CSV</a>
  </header>

  <div class="tabs" id="tabs">
    <button class="tab-btn active" data-tab="marketing">Marketing Surface</button>
    <button class="tab-btn" data-tab="gated">Gated Asset Quality</button>
  </div>

  <div class="overview" id="overview"></div>

  <div class="controls">
    <input type="text" id="search" placeholder="Search title or URL…">
    <select id="type-filter"><option value="">All types</option></select>
    <select id="flag-filter"><option value="">All action flags</option></select>
    <select id="priority-filter"><option value="">All priorities</option></select>
  </div>

  <div class="card" style="padding:0; overflow-x:auto;">
    <table id="table">
      <thead>
        <tr>
          <th data-key="title">Title</th>
          <th data-key="type" id="type-th">Type</th>
          <th data-key="composite" class="num">Score</th>
          <th data-key="actionFlag">Action</th>
          <th data-key="priorityOrder">Priority</th>
          <th data-key="lastAudited">Last Audited</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="empty" style="display:none;">No items match your filters.</div>
  </div>

</div>

<script>
const STATUS = {
  Retain:    { color: "var(--status-good)",     order: 0 },
  Optimize:  { color: "var(--status-warning)",  order: 1 },
  Update:    { color: "var(--status-serious)",  order: 2 },
  Refresh:   { color: "var(--status-critical)", order: 3 },
};

function statusFor(flag) {
  const key = Object.keys(STATUS).find(k => (flag || "").includes(k));
  return STATUS[key] || { color: "var(--text-muted)", order: 9 };
}

// Impact x Effort quadrant: "low hanging fruit" (high impact, low effort)
// surfaces first. Colors reuse the status palette since this is the same
// kind of "how urgently should I act" signal.
const PRIORITY = {
  "Quick Win":     { color: "var(--status-good)",    order: 0 },
  "Major Project": { color: "var(--status-warning)", order: 1 },
  "Fill-In":       { color: "var(--text-muted)",     order: 2 },
  "Low Priority":  { color: "var(--text-muted)",     order: 3 },
};

function priorityFor(p) {
  return PRIORITY[p] || { color: "var(--text-muted)", order: 9 };
}

// Two tabs, two independent rubrics -- see build_gated_content.py /
// score_gated_assets.py for why the gated tab has different score axes
// (accuracy/brand/sales usability/substance/next-step, no SEO factor) and
// no meaningful "type" facet (it's SharePoint source path instead).
const CONFIG = {
  marketing: {
    label: "Marketing Surface",
    subtitle: "Quarterly marketing content scorecard — SEO, brand, freshness, readability, CTA",
    json: "data.json",
    csv: "scored_latest.csv",
    typeKey: "type",
    typeLabel: "Type",
    showTypeFilter: true,
    scoreFields: [
      { key: "seo", label: "SEO" },
      { key: "brand", label: "Brand" },
      { key: "freshness", label: "Freshness" },
      { key: "readability", label: "Readability" },
      { key: "cta", label: "CTA" },
    ],
  },
  gated: {
    label: "Gated Asset Quality",
    subtitle: "Gated whitepapers & eBooks, scored on the real PDF content — accuracy, brand, sales usability, substance, next-step clarity",
    json: "gated_data.json",
    csv: "gated_scored_latest.csv",
    typeKey: "source",
    typeLabel: "Source",
    showTypeFilter: false,
    scoreFields: [
      { key: "accuracy", label: "Accuracy" },
      { key: "brand", label: "Brand" },
      { key: "salesUsability", label: "Sales Usability" },
      { key: "substance", label: "Substance" },
      { key: "nextStep", label: "Next Step" },
    ],
  },
};

let DATA = {};       // tab -> payload from json
let activeTab = "marketing";
let ITEMS = [];
let sortKey = "composite";
let sortDir = -1;

function fmtDate(s) {
  return s && s !== "nan" ? s.slice(0, 10) : "—";
}

function renderOverview(items) {
  const total = items.length;
  const scored = items.filter(i => i.composite !== "" && i.composite !== null && !isNaN(Number(i.composite)));
  const avg = scored.length ? Math.round(scored.reduce((a, i) => a + Number(i.composite), 0) / scored.length) : 0;

  const counts = {};
  items.forEach(i => {
    const key = Object.keys(STATUS).find(k => (i.actionFlag || "").includes(k)) || "Unknown";
    counts[key] = (counts[key] || 0) + 1;
  });
  const maxCount = Math.max(1, ...Object.values(counts));

  const overview = document.getElementById("overview");
  overview.innerHTML = `
    <div class="card stat-tile">
      <p class="label">Total assets</p>
      <p class="value">${total.toLocaleString()}</p>
    </div>
    <div class="card stat-tile">
      <p class="label">Average composite score</p>
      <p class="value">${avg}<span style="font-size:16px;color:var(--text-muted);">/100</span></p>
    </div>
    <div class="card stat-tile">
      <p class="label">Needs attention (Update + Refresh)</p>
      <p class="value">${(counts.Update || 0) + (counts.Refresh || 0)}</p>
    </div>
    <div class="card stat-tile">
      <p class="label">Quick wins (high impact, low effort)</p>
      <p class="value" style="color:var(--status-good);">${items.filter(i => i.priority === "Quick Win").length}</p>
    </div>
    <div class="card chart-card">
      <p class="chart-title">Assets by action flag</p>
      ${Object.keys(STATUS).map(flag => {
        const n = counts[flag] || 0;
        const pct = Math.max(n ? 4 : 0, (n / maxCount) * 100);
        return `
        <div class="bar-row">
          <div class="bar-label">${flag}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${pct}%; background:${STATUS[flag].color};"></div></div>
          <div class="bar-count">${n}</div>
        </div>`;
      }).join("")}
    </div>
  `;
}

function populateFilters(items) {
  const cfg = CONFIG[activeTab];
  const typeSel = document.getElementById("type-filter");
  const flagSel = document.getElementById("flag-filter");
  const prioritySel = document.getElementById("priority-filter");

  typeSel.innerHTML = `<option value="">All ${cfg.typeLabel.toLowerCase()}s</option>`;
  typeSel.style.display = cfg.showTypeFilter ? "" : "none";
  if (cfg.showTypeFilter) {
    [...new Set(items.map(i => i[cfg.typeKey]).filter(Boolean))].sort().forEach(t => {
      const o = document.createElement("option"); o.value = t; o.textContent = t; typeSel.appendChild(o);
    });
  }

  flagSel.innerHTML = `<option value="">All action flags</option>`;
  Object.keys(STATUS).forEach(f => {
    const o = document.createElement("option"); o.value = f; o.textContent = f; flagSel.appendChild(o);
  });
  prioritySel.innerHTML = `<option value="">All priorities</option>`;
  Object.keys(PRIORITY).forEach(p => {
    const o = document.createElement("option"); o.value = p; o.textContent = p; prioritySel.appendChild(o);
  });
}

function currentFilters() {
  return {
    q: document.getElementById("search").value.trim().toLowerCase(),
    type: document.getElementById("type-filter").value,
    flag: document.getElementById("flag-filter").value,
    priority: document.getElementById("priority-filter").value,
  };
}

function renderTable() {
  const cfg = CONFIG[activeTab];
  const { q, type, flag, priority } = currentFilters();
  let rows = ITEMS.filter(i => {
    if (type && i[cfg.typeKey] !== type) return false;
    if (flag && !(i.actionFlag || "").includes(flag)) return false;
    if (priority && i.priority !== priority) return false;
    if (q && !((i.title || "").toLowerCase().includes(q) || (i.link || "").toLowerCase().includes(q))) return false;
    return true;
  });

  rows.forEach(i => { i.priorityOrder = priorityFor(i.priority).order; });

  rows.sort((a, b) => {
    let av = a[sortKey], bv = b[sortKey];
    if (sortKey === "composite" || sortKey === "priorityOrder") { av = Number(av) || 0; bv = Number(bv) || 0; }
    else { av = (av || "").toString().toLowerCase(); bv = (bv || "").toString().toLowerCase(); }
    if (av < bv) return -1 * sortDir;
    if (av > bv) return 1 * sortDir;
    return 0;
  });

  const tbody = document.getElementById("tbody");
  document.getElementById("empty").style.display = rows.length ? "none" : "block";
  tbody.innerHTML = rows.map((item, idx) => {
    const st = statusFor(item.actionFlag);
    const pr = priorityFor(item.priority);
    const typeVal = item[cfg.typeKey] || "";
    return `
    <tr class="item-row" data-idx="${idx}">
      <td class="title-cell"><a href="${item.link}" target="_blank" rel="noopener">${item.title || item.link}</a></td>
      <td class="type-cell" title="${typeVal}">${typeVal || "—"}</td>
      <td class="num">${item.composite !== "" ? item.composite : "—"}</td>
      <td><span class="flag"><span class="dot" style="background:${st.color};"></span>${item.actionFlag || "—"}</span></td>
      <td>${item.priority ? `<span class="flag"><span class="dot" style="background:${pr.color};"></span>${item.priority}</span>` : "—"}</td>
      <td>${fmtDate(item.lastAudited)}</td>
    </tr>
    <tr class="detail-row" data-idx="${idx}">
      <td colspan="6">
        <div class="detail-grid">
          ${cfg.scoreFields.map(f => `<div class="mini"><p class="label">${f.label}</p><p class="value">${item[f.key] ?? "—"}</p></div>`).join("")}
          <div class="mini"><p class="label">Impact / Effort</p><p class="value" style="font-size:14px;">${item.impact || "—"} / ${item.effort || "—"}</p></div>
        </div>
        <p class="notes">${item.notes || ""}</p>
        <ul class="suggestions">${(item.suggestions || []).map(s => `<li>${s}</li>`).join("")}</ul>
      </td>
    </tr>`;
  }).join("");

  tbody.querySelectorAll("tr.item-row").forEach(tr => {
    tr.addEventListener("click", () => {
      const idx = tr.getAttribute("data-idx");
      const detail = tbody.querySelector(`tr.detail-row[data-idx="${idx}"]`);
      detail.classList.toggle("open");
    });
  });
}

function switchTab(tab) {
  activeTab = tab;
  const cfg = CONFIG[tab];
  const payload = DATA[tab] || { items: [] };
  ITEMS = payload.items || [];

  document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.getAttribute("data-tab") === tab));
  document.getElementById("subtitle").textContent = cfg.subtitle;
  document.getElementById("source").textContent = payload.source ? `Data source: ${payload.source}` : "";
  document.getElementById("download-btn").href = cfg.csv;
  document.getElementById("type-th").textContent = cfg.typeLabel;
  document.getElementById("type-th").setAttribute("data-key", cfg.typeKey);

  document.getElementById("search").value = "";
  sortKey = "composite";
  sortDir = -1;

  renderOverview(ITEMS);
  populateFilters(ITEMS);
  renderTable();
}

function init() {
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => switchTab(btn.getAttribute("data-tab")));
  });

  document.getElementById("search").addEventListener("input", renderTable);
  document.getElementById("type-filter").addEventListener("change", renderTable);
  document.getElementById("flag-filter").addEventListener("change", renderTable);
  document.getElementById("priority-filter").addEventListener("change", renderTable);

  document.querySelectorAll("thead th[data-key]").forEach(th => {
    th.addEventListener("click", () => {
      const key = th.getAttribute("data-key");
      sortDir = (sortKey === key) ? -sortDir : -1;
      sortKey = key;
      renderTable();
    });
  });

  switchTab("marketing");
}

Promise.all([
  fetch("data.json").then(r => r.json()),
  fetch("gated_data.json").then(r => r.json()).catch(() => ({ items: [] })),
])
  .then(([marketing, gated]) => {
    DATA = { marketing, gated };
    init();
  })
  .catch(err => {
    document.getElementById("overview").innerHTML =
      `<div class="card" style="grid-column:1/-1;">Couldn't load data.json (${err}). Run build_site.py and redeploy.</div>`;
  });
</script>
</body>
</html>
